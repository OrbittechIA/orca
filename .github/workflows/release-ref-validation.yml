      - name: Prepare frozen control bundle part6
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'ADMISSION'
          import os,time
          final=float(os.environ["AUDIT166_FINALIZATION_DEADLINE"])
          hard=float(os.environ["AUDIT166_HARD_JOB_DEADLINE"])
