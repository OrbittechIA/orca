      - name: Bind frozen planner bytes for every consumer
        id: plan_pin
        timeout-minutes: 1
        shell: bash
        run: |
          python3 - <<'PLANPIN'
          import os,hashlib
          from pathlib import Path
          value=hashlib.sha256((Path(os.environ['AUDIT166_EVIDENCE'])/'ci-shards/expected.json').read_bytes()).hexdigest()
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('sha256='+value+'\n')
          PLANPIN
      - name: Always enforce16MiB artifact and8MiB report caps
        id: artifact_budget
        if: ${{ always() }}
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'BUDGET'
          import os
          from pathlib import Path
          root=Path(os.environ['AUDIT166_EVIDENCE'])
          assert root.is_dir() and not root.is_symlink()
          total=unit=0
          for item in root.rglob('*'):
              assert not item.is_symlink()
              assert item.is_dir() or item.is_file()
              if item.is_file():
                  total+=item.lstat().st_size
                  if 'unit-failures' in item.relative_to(root).parts:unit+=item.lstat().st_size
          assert total<=16*1024**2 and unit<=8*1024**2
          BUDGET
      - name: Always retain bounded evidence
        if: ${{ always() && steps.artifact_budget.outcome == 'success' }}
        timeout-minutes: 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: "orca4eac-sharded16-plan-and-colocated-a1"
          path: "${{ runner.temp }}/orca245-evidence/"
          retention-days: "1"
          if-no-files-found: "error"
          compression-level: "6"
      - name: Finally dispose own memo redundant to enforced read-only cache tokens
        if: ${{ always() }}
        timeout-minutes: 1
        shell: bash
        run: |
          python3 "$AUDIT166_TOOLS/suppress-own-post-cache.py"

