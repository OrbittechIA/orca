      shell: bash
      run: |
        set -euo pipefail
        python3 "$AUDIT166_TOOLS/appimage-control.py" metadata-budget
      id: diagnostic_gate
      if: ${{ always() }}
    - name: Retain bounded diagnostics
      if: ${{ always() && steps.diagnostic_gate.outcome == 'success' }}
      timeout-minutes: 1
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: wake-f86-build-diagnostics-${{ github.run_id }}-a1
        path: ${{ runner.temp }}/orca245-evidence/
        retention-days: '1'
        compression-level: '6'
        if-no-files-found: error
