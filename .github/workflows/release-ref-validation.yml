          with part.open('x') as f:f.write('')
          data=zlib.decompress(base64.b64decode(part.read_text(),validate=True))
          assert hashlib.sha256(data).hexdigest()=='831bcb29c7678cd627949f0206cbfbbf65487842d0a9eda3468246044a2b2504'
