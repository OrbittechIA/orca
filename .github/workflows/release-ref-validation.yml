          node config/scripts/install-electron-package-binary.mjs
          node --version > "$AUDIT166_EVIDENCE/toolchain.txt"
          pnpm --version >> "$AUDIT166_EVIDENCE/toolchain.txt"
          bun --version >> "$AUDIT166_EVIDENCE/toolchain.txt"
          node -p "require('./node_modules/vitest/package.json').version" >> "$AUDIT166_EVIDENCE/toolchain.txt"
      - name: Run exactly one bounded owned producer
        timeout-minutes: 23
        shell: bash
