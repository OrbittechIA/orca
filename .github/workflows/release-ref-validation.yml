        no-cache: 'true'
    - name: Admit mobile dependency phase
      timeout-minutes: 1
      shell: bash
      run: |
        set -euo pipefail
        python3 "$AUDIT166_TOOLS/appimage-control.py" admit 180
    - name: Install frozen mobile dependencies
      timeout-minutes: 3
      uses: ./.github/actions/install-mobile-dependencies
    - name: Verify exact toolchain
      timeout-minutes: 1
      shell: bash
      run: |
        set -euo pipefail
        python3 "$AUDIT166_TOOLS/appimage-control.py" toolchain
    - name: Build native and desktop assets with standard hooks
      timeout-minutes: 22
      shell: bash
      run: |
        set -euo pipefail
        python3 "$AUDIT166_TOOLS/appimage-control.py" phase assets
    - name: Build AppImage with all upstream packaging hooks
      timeout-minutes: 12
      shell: bash
      run: |
        set -euo pipefail
        python3 "$AUDIT166_TOOLS/appimage-control.py" phase package
    - name: Suppress only own pnpm post memo before artifact finalization
      timeout-minutes: 1
      shell: bash
      run: |
        set -euo pipefail
        python3 "$AUDIT166_TOOLS/suppress-own-post-cache.py"
      if: ${{ always() }}
