  fresh-source-checks:
    name: fresh-source-checks
    needs: plan-and-colocated
    if: github.repository == 'OrbittechIA/orca' && github.event.repository.private == false && inputs.expected_control_sha == github.sha && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/salvadorgu7/wake-f86-hosted-control-20261101' && github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ORCA_BACKGROUND_LAUNCH: '1'
      NODE_OPTIONS: --max-old-space-size=6144
      GOMEMLIMIT: 10GiB
      GOMAXPROCS: '4'
      CI: 'true'
      ORCA_BUILD_COMMIT: 4eac6a5e901b6260fa60796e201a93ca8f5262a0
      ORCA_LOCAL_MODULE_CACHE: '0'
      WAKE_EXPECTED_CONTROL_SHA: ${{ inputs.expected_control_sha }}
      WAKE_FINANCE_ADMISSION_SHA256: ${{ inputs.finance_admission_sha256 }}
      AUDIT166_LANE: fresh-source-checks
      AUDIT166_EXPECTED_PLAN_SHA: ${{ needs.plan-and-colocated.outputs.expected-sha }}
    steps:
      - name: Anchor native job deadline before checkout
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'JOBPATHS'
          import os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          assert root.is_absolute() and '\n' not in str(root) and '\r' not in str(root)
          paths={'AUDIT166_TOOLS':root/'audit166-control','AUDIT166_EVIDENCE':root/'orca245-evidence'}
          lane=os.environ['AUDIT166_LANE']
          if lane.startswith('unit-shard-') or lane=='fresh-source-checks':paths['AUDIT166_PLAN']=root/'unit-plan'
          if lane=='union-coverage':paths['AUDIT166_DOWNLOADS']=root/'unit-downloads'
          with open(os.environ['GITHUB_ENV'],'a') as environment:
              for name,path in paths.items():environment.write(f'{name}={path}\n')
          JOBPATHS
          mkdir "$RUNNER_TEMP/audit166-control" "$RUNNER_TEMP/orca245-evidence"
          python3 - <<'CLOCK'
          #!/usr/bin/env python3
          """First-step Linux clock: anchor to this job's Runner.Worker ancestor birth.

          Includes action-download/setup time before the first user step. No global
          process-name search; read only the current process's verified ancestor chain.
          """
          import json
          import os
          from pathlib import Path
          import time

          out = Path(os.environ['RUNNER_TEMP']) / 'orca245-evidence' / 'clock.json'
          record = {'schema': 'audit166-job-clock-v1', 'anchor': None, 'error': None,
                    'jobLimitSeconds': 2700, 'hardMarginSeconds': 60,
                    'finalizationReserveSeconds': 300}
          try:
              pid = os.getpid()
              expected_birth = None
              chain = []
              for _ in range(48):
                  text = Path(f'/proc/{pid}/stat').read_text()
                  end = text.rindex(')')
                  comm = text[text.index('(') + 1:end]
                  fields = text[end + 2:].split()
                  birth, parent = int(fields[19]), int(fields[1])
                  assert expected_birth is None or birth == expected_birth
                  chain.append({'pid': pid, 'birth': birth, 'parentPid': parent, 'comm': comm})
                  if comm == 'Runner.Worker':
                      elapsed = time.clock_gettime(time.CLOCK_BOOTTIME) - birth / os.sysconf('SC_CLK_TCK')
                      assert elapsed >= 0
                      started = time.time() - elapsed
                      hard = started + 2700 - 60
                      finalization = hard - 300
                      assert finalization > time.time() + 95, 'preparation admission already expired'
                      record.update({'anchor': 'verified-ancestor-Runner.Worker-birth', 'ancestors': chain,
                                     'workerBirthWallSeconds': started, 'hardJobDeadline': hard,
                                     'finalizationStartDeadline': finalization})
                      with Path(os.environ['GITHUB_ENV']).open('a') as env:
                          env.write(f'AUDIT166_HARD_JOB_DEADLINE={hard}\n')
                          env.write(f'AUDIT166_FINALIZATION_DEADLINE={finalization}\n')
                      break
                  assert parent > 0 and parent != pid
                  parent_text = Path(f'/proc/{parent}/stat').read_text()
                  parent_fields = parent_text[parent_text.rindex(')') + 2:].split()
                  parent_birth = int(parent_fields[19])
                  # Revalidate the child's parent edge before following a possibly stale PID.
                  check = Path(f'/proc/{pid}/stat').read_text()
                  again = check[check.rindex(')') + 2:].split()
                  assert int(again[19]) == birth and int(again[1]) == parent
                  parent_check = Path(f'/proc/{parent}/stat').read_text()
                  assert int(parent_check[parent_check.rindex(')') + 2:].split()[19]) == parent_birth
                  pid = parent
                  expected_birth = parent_birth
              else:
                  raise RuntimeError('Runner.Worker ancestor not found; no deadline invented')
          except BaseException as error:
              record['error'] = type(error).__name__ + ': ' + str(error)
              out.write_text(json.dumps(record, indent=1) + '\n')
              raise
          out.write_text(json.dumps(record, indent=1) + '\n')
          CLOCK
