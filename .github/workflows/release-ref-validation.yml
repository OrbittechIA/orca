name: Core wake f86 qualification and candidate
run-name: Core wake f86 mandatory check then AppImage candidate
'on':
  workflow_dispatch:
    inputs:
      expected_control_sha:
        description: Exact independently reviewed control commit
        required: true
        type: string
      finance_admission_sha256:
        description: Fresh bound Finance receipt; no EBE acceptance reuse
        required: true
        type: string
permissions:
  contents: read
  actions: read
cache-mode: read
concurrency:
  group: core-wake-f86-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qualification:
    name: Wake f86 qualification
    if: github.repository == 'OrbittechIA/orca' && github.event.repository.private == false && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/salvadorgu7/wake-f86-hosted-control-20261101' && github.run_attempt == '1' && inputs.expected_control_sha == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ORCA_BACKGROUND_LAUNCH: '1'
      CI: 'true'
      ORCA_PNPM_GLOBAL_VIRTUAL_STORE: '0'
      ORCA_CI_MAIN_SOURCEMAPS: '0'
      ORCA_BUILD_COMMIT: f86ddedd7f32f1fcedbdab1011e9349059d8f282
      NODE_OPTIONS: --max-old-space-size=4096
      AUDIT166_LANE: wake-f86-qualification
      ORCA_CHECK_CONCURRENCY: '1'
      ORCA_LOCAL_MODULE_CACHE: '0'
      WAKE_EXPECTED_CONTROL_SHA: ${{ inputs.expected_control_sha }}
      WAKE_FINANCE_ADMISSION_SHA256: ${{ inputs.finance_admission_sha256 }}
    outputs:
      qualification_sha256: ${{ steps.qualified.outputs.qualification_sha256 }}
      source: ${{ steps.qualified.outputs.source }}
    steps:
    - name: Prepare private job paths
      timeout-minutes: 1
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PATHS'
        import os
        from pathlib import Path
        root=Path(os.environ['RUNNER_TEMP'])
        assert root.is_absolute() and '\n' not in str(root) and '\r' not in str(root)
        paths={'AUDIT166_TOOLS':root/'wake-f86-control','AUDIT166_EVIDENCE':root/'orca245-evidence'}
        for path in paths.values():path.mkdir(exist_ok=False)
        with open(os.environ['GITHUB_ENV'],'a') as f:
            for name,path in paths.items():f.write(f'{name}={path}\n')
        PATHS
    - name: Prepare pinned clock.py
      timeout-minutes: 1
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PAYLOAD'
        import os,base64,zlib,hashlib
        from pathlib import Path
        data=zlib.decompress(base64.b64decode('',validate=True))
        assert hashlib.sha256(data).hexdigest()=='99b5996eff7ec088d9eb4050b9a46bc98f6f36ceb975b3288308b817c89b8cd6'
        with (Path(os.environ['AUDIT166_TOOLS'])/'clock.py').open('xb') as f:f.write(data)
        PAYLOAD
    - name: Prepare pinned supervisor.py
      timeout-minutes: 1
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PAYLOAD'
        import os,base64,zlib,hashlib
        from pathlib import Path
        data=zlib.decompress(base64.b64decode('',validate=True))
        assert hashlib.sha256(data).hexdigest()=='770f9d6ff19795ea8278a7713af2d73ac2d68195073ad8d107bb0e0d6afa80eb'
        with (Path(os.environ['AUDIT166_TOOLS'])/'supervisor.py').open('xb') as f:f.write(data)
        PAYLOAD
    - name: Prepare pinned capture.py
      timeout-minutes: 1
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PAYLOAD'
        import os,base64,zlib,hashlib
        from pathlib import Path
        data=zlib.decompress(base64.b64decode('',validate=True))
        assert hashlib.sha256(data).hexdigest()=='7795e35295d36dcf27896110698ac0c63065b80a1c5d095af38effcc1225ef4a'
        with (Path(os.environ['AUDIT166_TOOLS'])/'capture.py').open('xb') as f:f.write(data)
        PAYLOAD
    - name: Prepare pinned suppress-own-post-cache.py
      timeout-minutes: 1
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PAYLOAD'
        import os,base64,zlib,hashlib
        from pathlib import Path
        data=zlib.decompress(base64.b64decode('',validate=True))
        assert hashlib.sha256(data).hexdigest()=='c034230a41ded19df5426da69245102730adecc4d1f1d2ba04a324628c7756b6'
        with (Path(os.environ['AUDIT166_TOOLS'])/'suppress-own-post-cache.py').open('xb') as f:f.write(data)
        PAYLOAD
    - name: Prepare pinned appimage-control.py
      timeout-minutes: 1
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PAYLOAD'
        import os,base64,zlib,hashlib
        from pathlib import Path
        data=zlib.decompress(base64.b64decode('',validate=True))
        assert hashlib.sha256(data).hexdigest()=='1f6c597cd111229f764c122e1badffc0aa4c0fb2553e8d04824ecd1adaee8289'
        with (Path(os.environ['AUDIT166_TOOLS'])/'appimage-control.py').open('xb') as f:f.write(data)
        PAYLOAD
    - name: Prepare pinned SOURCE-PINS.json
      timeout-minutes: 1
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PAYLOAD'
        import os,base64,zlib,hashlib
        from pathlib import Path
        data=zlib.decompress(base64.b64decode('',validate=True))
        assert hashlib.sha256(data).hexdigest()=='9a50e619654c961a7b83af1cdb99a6b706fa0a6df2a8ba1ea7723ab57b329309'
        with (Path(os.environ['AUDIT166_TOOLS'])/'SOURCE-PINS.json').open('xb') as f:f.write(data)
        PAYLOAD
    - name: Prepare pinned CONTRACT.json
      timeout-minutes: 1
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PAYLOAD'
        import os,base64,zlib,hashlib
        from pathlib import Path
        data=zlib.decompress(base64.b64decode('',validate=True))
        assert hashlib.sha256(data).hexdigest()=='e6909614f7bc9385d1926a119abe6bd23b7b59f8cd366a2bc8ee8d8acfba3512'
        with (Path(os.environ['AUDIT166_TOOLS'])/'CONTRACT.json').open('xb') as f:f.write(data)
        PAYLOAD
    - name: Anchor complete 45 minute job clock
      timeout-minutes: 1
      shell: bash
      run: |
        set -euo pipefail
        python3 "$AUDIT166_TOOLS/clock.py"
    - name: Require exact control and fresh Finance binding
      timeout-minutes: 1
      shell: bash
      run: |
        set -euo pipefail
        python3 "$AUDIT166_TOOLS/appimage-control.py" context
    - name: Checkout exact f86 product
      timeout-minutes: 2
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: f86ddedd7f32f1fcedbdab1011e9349059d8f282
        persist-credentials: 'false'
        fetch-depth: '0'
    - name: Verify exact source, base and clean dedicated runner
      timeout-minutes: 1
      shell: bash
      run: |
        set -euo pipefail
        python3 "$AUDIT166_TOOLS/appimage-control.py" preflight
    - name: Admit dependency phase
      timeout-minutes: 1
      shell: bash
      run: |
        set -euo pipefail
        python3 "$AUDIT166_TOOLS/appimage-control.py" admit 600
    - name: Install source dependencies with enforced cache read
      timeout-minutes: 8
      uses: ./.github/actions/install-node-dependencies
      with:
        node-version: 24.18.1
        native-runtime: node
        cache-pnpm-store: 'false'
        cache-pnpm-verification: 'false'
        persist-native-cache: 'false'
        cache-electron-package: 'false'
    - name: Setup pinned Bun144
      timeout-minutes: 1
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      with:
        bun-version-file: config/.bun-version
        no-cache: 'true'
    - name: Verify pinned toolchain
      timeout-minutes: 1
      shell: bash
      run: |
        set -euo pipefail
        python3 "$AUDIT166_TOOLS/appimage-control.py" toolchain
    - name: Prepare private native unit evidence
      timeout-minutes: 1
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'REPORTS'
        import os
        from pathlib import Path
        p=Path(os.environ["AUDIT166_EVIDENCE"])/"unit-tests"
        p.mkdir(exist_ok=False)
        with open(os.environ["GITHUB_ENV"],"a") as f:f.write("ORCA_UNIT_FAILURE_REPORT_DIR="+str(p)+"\n")
        REPORTS
    - name: Run mandatory source qualification once with reviewed supervisor
      timeout-minutes: 27
      shell: bash
      run: |
        set -euo pipefail
        python3 "$AUDIT166_TOOLS/appimage-control.py" phase qualify
    - name: Suppress only own pnpm post memo before artifact finalization
      timeout-minutes: 1
      shell: bash
      run: |
        set -euo pipefail
        python3 "$AUDIT166_TOOLS/suppress-own-post-cache.py"
      if: ${{ always() }}
    - name: Observe final disk and containers without cleanup
      timeout-minutes: 1
      shell: bash
      run: |
        set -euo pipefail
        python3 "$AUDIT166_TOOLS/appimage-control.py" observe-final
      if: ${{ always() }}
    - name: Require complete stock qualification and critical module results
      timeout-minutes: 1
      shell: bash
      run: |
        set -euo pipefail
        python3 "$AUDIT166_TOOLS/appimage-control.py" gate-qualification
      id: qualified
    - name: Gate diagnostic byte budget
      timeout-minutes: 1
      shell: bash
      run: |
        set -euo pipefail
        python3 "$AUDIT166_TOOLS/appimage-control.py" metadata-budget
      id: diagnostic_gate
      if: ${{ always() }}
    - name: Retain bounded diagnostics
      if: ${{ always() && steps.diagnostic_gate.outcome == 'success' }}
      timeout-minutes: 1
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: wake-f86-qualification-${{ github.run_id }}-a1
        path: ${{ runner.temp }}/orca245-evidence/
        retention-days: '1'
        compression-level: '6'
        if-no-files-found: error
  appimage:
    name: Wake f86 candidate AppImage
    needs:
    - qualification
    if: github.repository == 'OrbittechIA/orca' && github.event.repository.private == false && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/salvadorgu7/wake-f86-hosted-control-20261101' && github.run_attempt == '1' && inputs.expected_control_sha == github.sha && needs.qualification.result == 'success' && needs.qualification.outputs.source == 'f86ddedd7f32f1fcedbdab1011e9349059d8f282'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ORCA_BACKGROUND_LAUNCH: '1'
      CI: 'true'
      ORCA_PNPM_GLOBAL_VIRTUAL_STORE: '0'
      ORCA_CI_MAIN_SOURCEMAPS: '0'
      ORCA_BUILD_COMMIT: f86ddedd7f32f1fcedbdab1011e9349059d8f282
      NODE_OPTIONS: --max-old-space-size=4096
      AUDIT166_LANE: wake-f86-build
      ORCA_CHECK_CONCURRENCY: '1'
      ORCA_LOCAL_MODULE_CACHE: '0'
      WAKE_EXPECTED_CONTROL_SHA: ${{ inputs.expected_control_sha }}
      WAKE_FINANCE_ADMISSION_SHA256: ${{ inputs.finance_admission_sha256 }}
      WAKE_QUALIFICATION_SHA256: ${{ needs.qualification.outputs.qualification_sha256 }}
    steps:
    - name: Prepare private job paths
      timeout-minutes: 1
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PATHS'
        import os
        from pathlib import Path
        root=Path(os.environ['RUNNER_TEMP'])
        assert root.is_absolute() and '\n' not in str(root) and '\r' not in str(root)
        paths={'AUDIT166_TOOLS':root/'wake-f86-control','AUDIT166_EVIDENCE':root/'orca245-evidence','WAKE_QUALIFICATION_DIRECTORY':root/'wake-f86-qualification'}
        for path in paths.values():path.mkdir(exist_ok=False)
        with open(os.environ['GITHUB_ENV'],'a') as f:
            for name,path in paths.items():f.write(f'{name}={path}\n')
        PATHS
    - name: Prepare pinned clock.py
      timeout-minutes: 1
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PAYLOAD'
        import os,base64,zlib,hashlib
        from pathlib import Path
        data=zlib.decompress(base64.b64decode('',validate=True))
        assert hashlib.sha256(data).hexdigest()=='99b5996eff7ec088d9eb4050b9a46bc98f6f36ceb975b3288308b817c89b8cd6'
        with (Path(os.environ['AUDIT166_TOOLS'])/'clock.py').open('xb') as f:f.write(data)
        PAYLOAD
    - name: Prepare pinned supervisor.py
      timeout-minutes: 1
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PAYLOAD'
        import os,base64,zlib,hashlib
        from pathlib import Path
        data=zlib.decompress(base64.b64decode('',validate=True))
        assert hashlib.sha256(data).hexdigest()=='770f9d6ff19795ea8278a7713af2d73ac2d68195073ad8d107bb0e0d6afa80eb'
        with (Path(os.environ['AUDIT166_TOOLS'])/'supervisor.py').open('xb') as f:f.write(data)
        PAYLOAD
    - name: Prepare pinned capture.py
      timeout-minutes: 1
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PAYLOAD'
        import os,base64,zlib,hashlib
        from pathlib import Path
        data=zlib.decompress(base64.b64decode('',validate=True))
        assert hashlib.sha256(data).hexdigest()=='7795e35295d36dcf27896110698ac0c63065b80a1c5d095af38effcc1225ef4a'
        with (Path(os.environ['AUDIT166_TOOLS'])/'capture.py').open('xb') as f:f.write(data)
        PAYLOAD
    - name: Prepare pinned suppress-own-post-cache.py
      timeout-minutes: 1
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PAYLOAD'
        import os,base64,zlib,hashlib
        from pathlib import Path
        data=zlib.decompress(base64.b64decode('',validate=True))
        assert hashlib.sha256(data).hexdigest()=='c034230a41ded19df5426da69245102730adecc4d1f1d2ba04a324628c7756b6'
        with (Path(os.environ['AUDIT166_TOOLS'])/'suppress-own-post-cache.py').open('xb') as f:f.write(data)
        PAYLOAD
    - name: Prepare pinned appimage-control.py
      timeout-minutes: 1
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PAYLOAD'
        import os,base64,zlib,hashlib
        from pathlib import Path
        data=zlib.decompress(base64.b64decode('',validate=True))
        assert hashlib.sha256(data).hexdigest()=='1f6c597cd111229f764c122e1badffc0aa4c0fb2553e8d04824ecd1adaee8289'
        with (Path(os.environ['AUDIT166_TOOLS'])/'appimage-control.py').open('xb') as f:f.write(data)
        PAYLOAD
    - name: Prepare pinned SOURCE-PINS.json
      timeout-minutes: 1
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PAYLOAD'
        import os,base64,zlib,hashlib
        from pathlib import Path
        data=zlib.decompress(base64.b64decode('',validate=True))
        assert hashlib.sha256(data).hexdigest()=='9a50e619654c961a7b83af1cdb99a6b706fa0a6df2a8ba1ea7723ab57b329309'
        with (Path(os.environ['AUDIT166_TOOLS'])/'SOURCE-PINS.json').open('xb') as f:f.write(data)
        PAYLOAD
    - name: Prepare pinned CONTRACT.json
      timeout-minutes: 1
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PAYLOAD'
        import os,base64,zlib,hashlib
        from pathlib import Path
        data=zlib.decompress(base64.b64decode('',validate=True))
        assert hashlib.sha256(data).hexdigest()=='e6909614f7bc9385d1926a119abe6bd23b7b59f8cd366a2bc8ee8d8acfba3512'
        with (Path(os.environ['AUDIT166_TOOLS'])/'CONTRACT.json').open('xb') as f:f.write(data)
        PAYLOAD
    - name: Anchor complete 45 minute job clock
      timeout-minutes: 1
      shell: bash
      run: |
        set -euo pipefail
        python3 "$AUDIT166_TOOLS/clock.py"
    - name: Require exact control and fresh Finance binding
      timeout-minutes: 1
      shell: bash
      run: |
        set -euo pipefail
        python3 "$AUDIT166_TOOLS/appimage-control.py" context
    - name: Read exact same-run qualification artifact
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      timeout-minutes: 2
      with:
        name: wake-f86-qualification-${{ github.run_id }}-a1
        path: ${{ runner.temp }}/wake-f86-qualification
    - name: Require fresh semantic qualification and native predecessor success
      timeout-minutes: 1
      shell: bash
      run: |
        set -euo pipefail
        python3 "$AUDIT166_TOOLS/appimage-control.py" verify-predecessor
      env:
        GH_TOKEN: ${{ github.token }}
    - name: Checkout exact f86 product
      timeout-minutes: 2
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: f86ddedd7f32f1fcedbdab1011e9349059d8f282
        persist-credentials: 'false'
        fetch-depth: '0'
    - name: Verify exact source, base and clean dedicated runner
      timeout-minutes: 1
      shell: bash
      run: |
        set -euo pipefail
        python3 "$AUDIT166_TOOLS/appimage-control.py" preflight
    - name: Admit dependency phase
      timeout-minutes: 1
      shell: bash
      run: |
        set -euo pipefail
        python3 "$AUDIT166_TOOLS/appimage-control.py" admit 600
    - name: Install source dependencies with enforced cache read
