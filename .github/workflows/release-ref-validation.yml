name: Audit166 reviewed heartbeat delta
run-name: Audit166 Orca53 focused heartbeat validation
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
cache-mode: read
concurrency:
  group: audit166-heartbeat53-${{ github.ref }}
  cancel-in-progress: false
jobs:
  heartbeat-delta:
    name: heartbeat-delta
    if: github.repository == 'OrbittechIA/orca' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/audit166/heartbeat-feb-20261101' && github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ORCA_BACKGROUND_LAUNCH: '1'
      NODE_OPTIONS: --max-old-space-size=6144
      GOMEMLIMIT: 10GiB
      GOMAXPROCS: '4'
      AUDIT166_LANE: heartbeat-delta
    steps:
      - name: Anchor native job deadline before checkout
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'JOBPATHS'
          import os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          assert root.is_absolute() and '\n' not in str(root) and '\r' not in str(root)
          paths={'AUDIT166_TOOLS':root/'audit166-control','AUDIT166_EVIDENCE':root/'orca245-evidence'}
          lane=os.environ['AUDIT166_LANE']
          paths['AUDIT166_PLAN']=root/'orca245-evidence'
          if lane=='union-coverage':paths['AUDIT166_DOWNLOADS']=root/'unit-downloads'
          with open(os.environ['GITHUB_ENV'],'a') as environment:
              for name,path in paths.items():environment.write(f'{name}={path}\n')
          JOBPATHS
          mkdir "$RUNNER_TEMP/audit166-control" "$RUNNER_TEMP/orca245-evidence"
          python3 - <<'CLOCK'
          #!/usr/bin/env python3
          """First-step Linux clock: anchor to this job's Runner.Worker ancestor birth.

          Includes action-download/setup time before the first user step. No global
          process-name search; read only the current process's verified ancestor chain.
          """
          import json
          import os
          from pathlib import Path
          import time

          out = Path(os.environ['RUNNER_TEMP']) / 'orca245-evidence' / 'clock.json'
          record = {'schema': 'audit166-job-clock-v1', 'anchor': None, 'error': None,
                    'jobLimitSeconds': 2100, 'hardMarginSeconds': 60,
                    'finalizationReserveSeconds': 300}
          try:
              pid = os.getpid()
              expected_birth = None
              chain = []
              for _ in range(48):
                  text = Path(f'/proc/{pid}/stat').read_text()
                  end = text.rindex(')')
                  comm = text[text.index('(') + 1:end]
                  fields = text[end + 2:].split()
                  birth, parent = int(fields[19]), int(fields[1])
                  assert expected_birth is None or birth == expected_birth
                  chain.append({'pid': pid, 'birth': birth, 'parentPid': parent, 'comm': comm})
                  if comm == 'Runner.Worker':
                      elapsed = time.clock_gettime(time.CLOCK_BOOTTIME) - birth / os.sysconf('SC_CLK_TCK')
                      assert elapsed >= 0
                      started = time.time() - elapsed
                      hard = started + 2100 - 60
                      finalization = hard - 300
                      assert finalization > time.time() + 95, 'preparation admission already expired'
                      record.update({'anchor': 'verified-ancestor-Runner.Worker-birth', 'ancestors': chain,
                                     'workerBirthWallSeconds': started, 'hardJobDeadline': hard,
                                     'finalizationStartDeadline': finalization})
                      with Path(os.environ['GITHUB_ENV']).open('a') as env:
                          env.write(f'AUDIT166_HARD_JOB_DEADLINE={hard}\n')
                          env.write(f'AUDIT166_FINALIZATION_DEADLINE={finalization}\n')
                      break
                  assert parent > 0 and parent != pid
                  parent_text = Path(f'/proc/{parent}/stat').read_text()
                  parent_fields = parent_text[parent_text.rindex(')') + 2:].split()
                  parent_birth = int(parent_fields[19])
                  # Revalidate the child's parent edge before following a possibly stale PID.
                  check = Path(f'/proc/{pid}/stat').read_text()
                  again = check[check.rindex(')') + 2:].split()
                  assert int(again[19]) == birth and int(again[1]) == parent
                  parent_check = Path(f'/proc/{parent}/stat').read_text()
                  assert int(parent_check[parent_check.rindex(')') + 2:].split()[19]) == parent_birth
                  pid = parent
                  expected_birth = parent_birth
              else:
                  raise RuntimeError('Runner.Worker ancestor not found; no deadline invented')
          except BaseException as error:
              record['error'] = type(error).__name__ + ': ' + str(error)
              out.write_text(json.dumps(record, indent=1) + '\n')
              raise
          out.write_text(json.dumps(record, indent=1) + '\n')
          CLOCK
      - name: Prepare frozen control bundle part1
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'ADMISSION'
          import os,time
          final=float(os.environ["AUDIT166_FINALIZATION_DEADLINE"])
          hard=float(os.environ["AUDIT166_HARD_JOB_DEADLINE"])
          assert hard-final>=300
          assert time.time()+60+60<=final, "phase budget exhausted"
          ADMISSION
          python3 - <<'PAYLOAD'
          import os,base64,zlib,hashlib,json
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'audit166-control'
          part=root/'CONTROLS.payload'
          with part.open('x') as f:f.write('')
          PAYLOAD
      - name: Prepare frozen control bundle part2
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'ADMISSION'
          import os,time
          final=float(os.environ["AUDIT166_FINALIZATION_DEADLINE"])
          hard=float(os.environ["AUDIT166_HARD_JOB_DEADLINE"])
          assert hard-final>=300
          assert time.time()+60+60<=final, "phase budget exhausted"
          ADMISSION
          python3 - <<'PAYLOAD'
          import os,base64,zlib,hashlib,json
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'audit166-control'
          part=root/'CONTROLS.payload'
          with part.open('a') as f:f.write('')
          PAYLOAD
      - name: Prepare frozen control bundle part3
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'ADMISSION'
          import os,time
          final=float(os.environ["AUDIT166_FINALIZATION_DEADLINE"])
          hard=float(os.environ["AUDIT166_HARD_JOB_DEADLINE"])
          assert hard-final>=300
          assert time.time()+60+60<=final, "phase budget exhausted"
          ADMISSION
          python3 - <<'PAYLOAD'
          import os,base64,zlib,hashlib,json
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'audit166-control'
          part=root/'CONTROLS.payload'
          with part.open('a') as f:f.write('')
          PAYLOAD
      - name: Prepare frozen control bundle part4
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'ADMISSION'
          import os,time
          final=float(os.environ["AUDIT166_FINALIZATION_DEADLINE"])
          hard=float(os.environ["AUDIT166_HARD_JOB_DEADLINE"])
          assert hard-final>=300
          assert time.time()+60+60<=final, "phase budget exhausted"
          ADMISSION
          python3 - <<'PAYLOAD'
          import os,base64,zlib,hashlib,json
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'audit166-control'
          part=root/'CONTROLS.payload'
          with part.open('a') as f:f.write('')
          PAYLOAD
      - name: Prepare frozen control bundle part5
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'ADMISSION'
          import os,time
          final=float(os.environ["AUDIT166_FINALIZATION_DEADLINE"])
          hard=float(os.environ["AUDIT166_HARD_JOB_DEADLINE"])
          assert hard-final>=300
          assert time.time()+60+60<=final, "phase budget exhausted"
          ADMISSION
          python3 - <<'PAYLOAD'
          import os,base64,zlib,hashlib,json
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'audit166-control'
          part=root/'CONTROLS.payload'
          with part.open('a') as f:f.write('')
          PAYLOAD
      - name: Prepare frozen control bundle part6
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'ADMISSION'
          import os,time
          final=float(os.environ["AUDIT166_FINALIZATION_DEADLINE"])
          hard=float(os.environ["AUDIT166_HARD_JOB_DEADLINE"])
          assert hard-final>=300
          assert time.time()+60+60<=final, "phase budget exhausted"
          ADMISSION
          python3 - <<'PAYLOAD'
          import os,base64,zlib,hashlib,json
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'audit166-control'
          part=root/'CONTROLS.payload'
          with part.open('a') as f:f.write('')
          PAYLOAD
      - name: Prepare frozen control bundle part7
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'ADMISSION'
          import os,time
          final=float(os.environ["AUDIT166_FINALIZATION_DEADLINE"])
          hard=float(os.environ["AUDIT166_HARD_JOB_DEADLINE"])
          assert hard-final>=300
          assert time.time()+60+60<=final, "phase budget exhausted"
          ADMISSION
          python3 - <<'PAYLOAD'
          import os,base64,zlib,hashlib,json
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'audit166-control'
          part=root/'CONTROLS.payload'
          with part.open('a') as f:f.write('')
          data=zlib.decompress(base64.b64decode(part.read_text(),validate=True))
          assert hashlib.sha256(data).hexdigest()=='fc0b48319d11551bf6aab00b3ae48f54e5a1851502ec09a8696c1a23b4bae450'
          records=json.loads(data);names=[record['name'] for record in records]
          assert len(names)==len(set(names)) and all(Path(name).name==name and name not in ['.','..'] for name in names)
          for record in records:
              data=record['utf8'].encode()
              assert hashlib.sha256(data).hexdigest()==record['sha256']
              with (root/record['name']).open('xb') as f:f.write(data)
          part.unlink()
          PAYLOAD
      - name: Checkout frozen product source
        timeout-minutes: 2
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: "feb079b1e7e82e213f4636efbc1f3920960a7a29"
          fetch-depth: "192"
          persist-credentials: "false"
      - name: Verify exact source53 and unchanged control bindings
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'ADMISSION'
          import os,time
          final=float(os.environ["AUDIT166_FINALIZATION_DEADLINE"])
          hard=float(os.environ["AUDIT166_HARD_JOB_DEADLINE"])
          assert hard-final>=300
          assert time.time()+60+60<=final, "phase budget exhausted"
          ADMISSION
          python3 "$AUDIT166_TOOLS/delta-runtime.py" preflight "$AUDIT166_EVIDENCE"
      - name: Fetch and verify frozen official refs
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'ADMISSION'
          import os,time
          final=float(os.environ["AUDIT166_FINALIZATION_DEADLINE"])
          hard=float(os.environ["AUDIT166_HARD_JOB_DEADLINE"])
          assert hard-final>=300
          assert time.time()+180+60<=final, "phase budget exhausted"
          ADMISSION
          git fetch --no-tags --depth=1 https://github.com/stablyai/orca.git refs/tags/v1.4.184:refs/tags/v1.4.184 refs/tags/v1.4.190:refs/tags/v1.4.190 refs/tags/v1.4.199:refs/tags/v1.4.199 refs/tags/v1.4.205:refs/tags/v1.4.205 refs/tags/v1.4.211:refs/tags/v1.4.211 refs/tags/v1.4.212:refs/tags/v1.4.212 refs/tags/v1.4.214:refs/tags/v1.4.214 refs/tags/v1.4.218:refs/tags/v1.4.218 refs/tags/v1.4.219:refs/tags/v1.4.219 refs/tags/v1.4.220:refs/tags/v1.4.220 refs/tags/v1.4.221:refs/tags/v1.4.221 refs/tags/v1.4.222:refs/tags/v1.4.222 refs/tags/v1.4.224:refs/tags/v1.4.224 refs/tags/v1.4.228:refs/tags/v1.4.228 refs/tags/v1.4.229:refs/tags/v1.4.229 refs/tags/v1.4.244:refs/tags/v1.4.244 refs/tags/v1.4.245:refs/tags/v1.4.245
          git fetch --no-tags --depth=1 https://github.com/stablyai/orca.git 3727100cc9dbcea6201f8a3e506676a3c4b53b18 4bb337741c335cfcc428d3b4271023566e2dadb8 4cb013c0a9251275fa3d20ea33b45429e07aa6be 5a56636f6679071d6ec68b851ef7932cd3222560 aac38d698ff75ac4c8658addab48ef5a83617619 b49abdb1f4da6b3d62dfa9ccf3c74dc9e74d291c b6b4d68cd844c921c7c5191cef72d5adafc0dafa e817b0e23747ffd6f16f2ddefea861950d82a3c0 f97ca2a49d9c711dab54a656a7f8a47ae6c6749c fd9125ea8c7b347cd8b675a4095e31cd3c865d25
          python3 "$AUDIT166_TOOLS/delta-runtime.py" refs "$AUDIT166_EVIDENCE"
      - name: Admit bounded script-free dependency setup
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'ADMISSION'
          import os,time
          final=float(os.environ["AUDIT166_FINALIZATION_DEADLINE"])
          hard=float(os.environ["AUDIT166_HARD_JOB_DEADLINE"])
          assert hard-final>=300
          assert time.time()+480+60<=final, "phase budget exhausted"
          ADMISSION
          true
      - name: Install source-declared toolchain without cache writes
        timeout-minutes: 8
        uses: ./.github/actions/install-node-dependencies
        with:
          node-version: "24.18.1"
          native-runtime: "node"
          cache-pnpm-store: "false"
          cache-pnpm-verification: "false"
          persist-native-cache: "false"
          cache-electron-package: "false"
      - name: Admit pinned Bun setup
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'ADMISSION'
          import os,time
          final=float(os.environ["AUDIT166_FINALIZATION_DEADLINE"])
          hard=float(os.environ["AUDIT166_HARD_JOB_DEADLINE"])
          assert hard-final>=300
          assert time.time()+120+60<=final, "phase budget exhausted"
          ADMISSION
          true
      - name: Install pinned Bun
        timeout-minutes: 2
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: "config/.bun-version"
          no-cache: "true"
      - name: Prepare hidden display and exact test toolchain
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'ADMISSION'
          import os,time
          final=float(os.environ["AUDIT166_FINALIZATION_DEADLINE"])
          hard=float(os.environ["AUDIT166_HARD_JOB_DEADLINE"])
          assert hard-final>=300
          assert time.time()+180+60<=final, "phase budget exhausted"
          ADMISSION
          command -v xvfb-run >/dev/null || { sudo apt-get update; sudo apt-get install -y xvfb; }
          node config/scripts/install-electron-package-binary.mjs
          node --version > "$AUDIT166_EVIDENCE/toolchain.txt"
          pnpm --version >> "$AUDIT166_EVIDENCE/toolchain.txt"
          bun --version >> "$AUDIT166_EVIDENCE/toolchain.txt"
          node -p "require('./node_modules/vitest/package.json').version" >> "$AUDIT166_EVIDENCE/toolchain.txt"
      - name: Run exactly one bounded owned producer
        timeout-minutes: 23
        shell: bash
        run: |
          python3 "$AUDIT166_TOOLS/delta-runtime.py" make_spec "$AUDIT166_EVIDENCE"
          python3 "$AUDIT166_TOOLS/supervisor.py" --spec "$AUDIT166_TOOLS/SUPERVISOR-SPEC.json" --capture "$AUDIT166_TOOLS/capture.py" --evidence "$AUDIT166_EVIDENCE" --job-finalization-deadline "$AUDIT166_FINALIZATION_DEADLINE" --hard-job-deadline "$AUDIT166_HARD_JOB_DEADLINE"
      - name: Always judge native final inventory and positive cleanup
        if: ${{ always() }}
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          python3 "$AUDIT166_TOOLS/delta-runtime.py" finalize "$AUDIT166_EVIDENCE"
      - name: Always enforce16MiB artifact and8MiB report caps
        id: artifact_budget
        if: ${{ always() }}
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'BUDGET'
          import os
          from pathlib import Path
          root=Path(os.environ['AUDIT166_EVIDENCE'])
          assert root.is_dir() and not root.is_symlink()
          total=unit=0
          for item in root.rglob('*'):
              assert not item.is_symlink()
              assert item.is_dir() or item.is_file()
              if item.is_file():
                  total+=item.lstat().st_size
                  if 'unit-failures' in item.relative_to(root).parts:unit+=item.lstat().st_size
          assert total<=16*1024**2 and unit<=8*1024**2
          BUDGET
      - name: Always retain bounded evidence
        if: ${{ always() && steps.artifact_budget.outcome == 'success' }}
        timeout-minutes: 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: "orcafeb-heartbeat-delta-heartbeat-delta-a1"
          path: "${{ runner.temp }}/orca245-evidence/"
          retention-days: "1"
          if-no-files-found: "error"
          compression-level: "6"
      - name: Finally dispose own memo redundant to enforced read-only cache tokens
        if: ${{ always() }}
        timeout-minutes: 1
        shell: bash
        run: |
          python3 "$AUDIT166_TOOLS/suppress-own-post-cache.py"
