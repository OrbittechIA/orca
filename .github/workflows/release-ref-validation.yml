          part=root/'CONTROLS.payload'
          with part.open('a') as f:f.write('')
          data=zlib.decompress(base64.b64decode(part.read_text(),validate=True))
          assert hashlib.sha256(data).hexdigest()=='40cb5dc751f882df2a12658dcf1f7ff82a55562cddf5e73a693ea6bfa92876e7'
          records=json.loads(data);names=[record['name'] for record in records]
          assert len(names)==len(set(names)) and all(Path(name).name==name and name not in ['.','..'] for name in names)
          for record in records:
              data=record['utf8'].encode()
              assert hashlib.sha256(data).hexdigest()==record['sha256']
              with (root/record['name']).open('xb') as f:f.write(data)
          part.unlink()
          PAYLOAD
      - name: Download all fourteen producer artifacts without merging
        timeout-minutes: 3
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: "orca472-fresh-*-a1"
          path: "${{ runner.temp }}/unit-downloads"
          merge-multiple: "false"
          digest-mismatch: "error"
      - name: Authenticate native jobs and exact coverage union
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        timeout-minutes: 3
        shell: bash
        run: |
          python3 "$AUDIT166_TOOLS/union.py"
      - name: Always enforce16MiB artifact and8MiB report caps
        id: artifact_budget
        if: ${{ always() }}
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'BUDGET'
          import os
          from pathlib import Path
          root=Path(os.environ['AUDIT166_EVIDENCE'])
          assert root.is_dir() and not root.is_symlink()
          total=unit=0
          for item in root.rglob('*'):
              assert not item.is_symlink()
              assert item.is_dir() or item.is_file()
              if item.is_file():
                  total+=item.lstat().st_size
                  if 'unit-failures' in item.relative_to(root).parts:unit+=item.lstat().st_size
          assert total<=16*1024**2 and unit<=8*1024**2
          BUDGET
      - name: Always retain bounded evidence
        if: ${{ always() && steps.artifact_budget.outcome == 'success' }}
        timeout-minutes: 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: "orca472-fresh-union-coverage-a1"
          path: "${{ runner.temp }}/orca245-evidence/"
          retention-days: "1"
          if-no-files-found: "error"
          compression-level: "6"
      - name: Finally dispose own memo redundant to enforced read-only cache tokens
        if: ${{ always() }}
        timeout-minutes: 1
        shell: bash
        run: |
          python3 "$AUDIT166_TOOLS/suppress-own-post-cache.py"
