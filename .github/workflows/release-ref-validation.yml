name: Audit166 pinned Orca qualification
run-name: Audit166 6809540 joint source qualification
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: audit166-pinned-6809540-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qualify:
    if: >-
      github.repository == 'OrbittechIA/orca' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/audit166/joint-6809540d' &&
      github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      ORCA_BACKGROUND_LAUNCH: '1'
      ORCA_CHECK_CONCURRENCY: '1'
      NODE_OPTIONS: --max-old-space-size=6144
      GOMEMLIMIT: 10GiB
      GOMAXPROCS: '4'
    steps:
      - name: Checkout the exact reviewed product source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 6809540d072d7a45abecb4b9efb24a6a2fdf28c2
          fetch-depth: 139
          persist-credentials: false
      - name: Verify immutable source and base
        shell: bash
        env:
          SOURCE_HASH_FILES: '["package.json","pnpm-lock.yaml","config/vitest.config.ts","config/scripts/check-changed.mjs","config/scripts/check-changed-selection.mjs","config/scripts/check-changed-code-quality.mjs","config/scripts/run-vitest.mjs","config/scripts/ci-unit-failure-reporter.mjs","config/scripts/vitest-run-filters.mjs","config/scripts/ci-unit-files.mjs","config/scripts/vitest-node-runtime-files.mjs","config/scripts/vitest-node-runtime-pool.ts","config/scripts/vitest-runtime-sequencer.mjs","config/scripts/vitest-local-module-cache.mjs","config/scripts/vitest-zod-bundle.mjs","config/scripts/workspace-source-exports.mjs","tests/e2e/cross-version-wire/release-checkout.ts","config/.bun-version","config/scripts/run-typecheck-projects-in-parallel.mjs","config/scripts/vitest-run-temp-directory.mjs","config/scripts/pinned-bun-executable.mjs"]'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 6809540d072d7a45abecb4b9efb24a6a2fdf28c2
          test "$(git rev-parse 'HEAD^{tree}')" = 88bc964756d02e0905e12351d1319468d2c8bce7
          test "$(git merge-base 1c6ac8c3c4d2c3dec2cb5966d225ca2a0e0471d3 HEAD)" = 1c6ac8c3c4d2c3dec2cb5966d225ca2a0e0471d3
          test -z "$(git status --porcelain --ignored)"
          test ! -e .cache/check-changed.json
          test ! -e node_modules
          test -f config/scripts/ci-unit-failure-reporter.mjs
          grep -q UNIT_FAILURE_REPORT_DIR_ENV config/vitest.config.ts
          test ! -e "$RUNNER_TEMP/orca245-evidence"
          mkdir "$RUNNER_TEMP/orca245-evidence"
          node --input-type=module <<'NODE'
          import {writeFileSync, readFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          import os from 'node:os';
          const git=(...args)=>execFileSync('git',args,{encoding:'utf8'}).trim();
          // Exactly the frozen contract's coverage inputs: the collector refuses any other keyset.
          const hashes=Object.fromEntries(JSON.parse(process.env.SOURCE_HASH_FILES).map(f=>[f,createHash('sha256').update(readFileSync(f)).digest('hex')]));
          const value={schema:'orca245-hosted-source-provenance-v2',source:git('rev-parse','HEAD'),tree:git('rev-parse','HEAD^{tree}'),base:'1c6ac8c3c4d2c3dec2cb5966d225ca2a0e0471d3',clean:git('status','--porcelain','--ignored')==='',workflowSha:process.env.GITHUB_WORKFLOW_SHA,workflowRef:process.env.GITHUB_WORKFLOW_REF,dispatchSha:process.env.GITHUB_SHA,event:process.env.GITHUB_EVENT_NAME,ref:process.env.GITHUB_REF,repository:process.env.GITHUB_REPOSITORY,runId:process.env.GITHUB_RUN_ID,attempt:process.env.GITHUB_RUN_ATTEMPT,image:process.env.ImageVersion,os:os.release(),arch:os.arch(),cpu:os.availableParallelism(),memoryBytes:os.totalmem(),hashes};
          writeFileSync(`${process.env.RUNNER_TEMP}/orca245-evidence/source.json`,JSON.stringify(value,null,2)+'\n');
          NODE
      - name: Fetch the validated official release snapshots into this disposable checkout only
        shell: bash
        env:
          EXPECTED_REFS: '{"tags":{"v1.4.184":{"tagObject":"284a244a12dfe266f62c103cc6b1b1d13203e0b4","commit":"2307f2ebbe1c1e737c0b12d920bb0a208332db2c"},"v1.4.190":{"tagObject":"43268cadff07d513a73181741090ece06a364fd6","commit":"6e4f817101daa18d82824b69243d9079baa9c416"},"v1.4.199":{"tagObject":"cb958df54b401a30172f8051d1a682cad33a7551","commit":"28957d6004dd191b6f0baff493a9fd3d37405d9d"},"v1.4.205":{"tagObject":"c3ac507ba02a652cce627d5acad9605f4792d7fc","commit":"11aba8bdc5e492d3ba01fc7fe333495ace74128f"},"v1.4.211":{"tagObject":"309f465bd44b511b82d3ce3fb8d1e3a5aedc00eb","commit":"5534462b50c660888487a2108700d4cf284270db"},"v1.4.212":{"tagObject":"2d61ec19a384106b46a66254e054103c480fc826","commit":"d937d22f498505c017634be9bf0540c9fa42e665"},"v1.4.214":{"tagObject":"4780b6aeb243d7c3e5c5dc2f61e950c87470339b","commit":"7468e9cccb35a8494f76dc95a37627121113ee80"},"v1.4.218":{"tagObject":"24d7d0362e4a2c9e613756f1529bb6bb455649df","commit":"75ea50273328d9bd5465170d10a098711d61b5a4"},"v1.4.219":{"tagObject":"482a2438d5d5b76d538b903c8bb8fa81ed48c540","commit":"e705cac04a1db7e7e2184746e912142d34ca838b"},"v1.4.220":{"tagObject":"7e66229dfdc57c53581ce97fd9a69dc73d5beb90","commit":"a7927b28ce45cbb044add478d957abe36c99ccd8"},"v1.4.221":{"tagObject":"bf0963821fcb8c6ef2674540f16c802688f5d70a","commit":"9dd8812384db85d0b4ede2d1e37f9d73bdb4ea8c"},"v1.4.222":{"tagObject":"fae770adf60aac8f0af02720565c1691fdd95dec","commit":"4bb6f2072b07c1f0664b809551f77754700570e4"},"v1.4.224":{"tagObject":"270a21b6767d6f63170711ec3222d17c3dd7c0f5","commit":"2bb20586ebc39d605e16d95f57420e20a16e7485"},"v1.4.228":{"tagObject":"45d0a479f5cd08a8e3f3c04c149c60e2d3bef582","commit":"d4d37f5d8f14b198f32883897110fbbee15e8ac2"},"v1.4.229":{"tagObject":"a3fdce0977b75dc3777439df6d3b928ad4d911cf","commit":"a0cd1644f320f1327f7495650a816111b495f3cd"},"v1.4.244":{"tagObject":"9096d705d84b8b8fd5d2d605ca2a27428cd74442","commit":"b8ec5c8d170bcb9988e65de547a3a4e98b2885a9"},"v1.4.245":{"tagObject":"7a5202ad17310bc22e1f03398a96a189a3b33f03","commit":"1c6ac8c3c4d2c3dec2cb5966d225ca2a0e0471d3"}},"literals":["3727100cc9dbcea6201f8a3e506676a3c4b53b18","4bb337741c335cfcc428d3b4271023566e2dadb8","4cb013c0a9251275fa3d20ea33b45429e07aa6be","5a56636f6679071d6ec68b851ef7932cd3222560","aac38d698ff75ac4c8658addab48ef5a83617619","b49abdb1f4da6b3d62dfa9ccf3c74dc9e74d291c","b6b4d68cd844c921c7c5191cef72d5adafc0dafa","e817b0e23747ffd6f16f2ddefea861950d82a3c0","f97ca2a49d9c711dab54a656a7f8a47ae6c6749c","fd9125ea8c7b347cd8b675a4095e31cd3c865d25"]}'
        run: |
          set -euo pipefail
          # Release tags land only in this runner's checkout; nothing is pushed or published anywhere.
          git fetch --no-tags --depth=1 https://github.com/stablyai/orca.git refs/tags/v1.4.184:refs/tags/v1.4.184 refs/tags/v1.4.190:refs/tags/v1.4.190 refs/tags/v1.4.199:refs/tags/v1.4.199 refs/tags/v1.4.205:refs/tags/v1.4.205 refs/tags/v1.4.211:refs/tags/v1.4.211 refs/tags/v1.4.212:refs/tags/v1.4.212 refs/tags/v1.4.214:refs/tags/v1.4.214 refs/tags/v1.4.218:refs/tags/v1.4.218 refs/tags/v1.4.219:refs/tags/v1.4.219 refs/tags/v1.4.220:refs/tags/v1.4.220 refs/tags/v1.4.221:refs/tags/v1.4.221 refs/tags/v1.4.222:refs/tags/v1.4.222 refs/tags/v1.4.224:refs/tags/v1.4.224 refs/tags/v1.4.228:refs/tags/v1.4.228 refs/tags/v1.4.229:refs/tags/v1.4.229 refs/tags/v1.4.244:refs/tags/v1.4.244 refs/tags/v1.4.245:refs/tags/v1.4.245
          git fetch --no-tags --depth=1 https://github.com/stablyai/orca.git 3727100cc9dbcea6201f8a3e506676a3c4b53b18 4bb337741c335cfcc428d3b4271023566e2dadb8 4cb013c0a9251275fa3d20ea33b45429e07aa6be 5a56636f6679071d6ec68b851ef7932cd3222560 aac38d698ff75ac4c8658addab48ef5a83617619 b49abdb1f4da6b3d62dfa9ccf3c74dc9e74d291c b6b4d68cd844c921c7c5191cef72d5adafc0dafa e817b0e23747ffd6f16f2ddefea861950d82a3c0 f97ca2a49d9c711dab54a656a7f8a47ae6c6749c fd9125ea8c7b347cd8b675a4095e31cd3c865d25
          test "$(git rev-parse HEAD)" = 6809540d072d7a45abecb4b9efb24a6a2fdf28c2
          test -z "$(git status --porcelain)"
          node --input-type=module <<'NODE'
          import {writeFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const git=(...args)=>execFileSync('git',args,{encoding:'utf8'}).trim();
          const expected=JSON.parse(process.env.EXPECTED_REFS);
          const tags=Object.entries(expected.tags).map(([tag,{tagObject,commit}])=>({tag,tagObject,commit,observedTagObject:git('rev-parse',`refs/tags/${tag}`),observedCommit:git('rev-parse',`refs/tags/${tag}^{commit}`)}));
          const literals=expected.literals.map(commit=>({commit,type:git('cat-file','-t',commit)}));
          const verified=tags.every(t=>t.observedTagObject===t.tagObject&&t.observedCommit===t.commit)&&literals.every(l=>l.type==='commit')&&expected.tags['v1.4.245']?.commit==='1c6ac8c3c4d2c3dec2cb5966d225ca2a0e0471d3'&&expected.tags['v1.4.222']?.commit==='4bb6f2072b07c1f0664b809551f77754700570e4';
          writeFileSync(`${process.env.RUNNER_TEMP}/orca245-evidence/refs.json`,JSON.stringify({schema:'orca245-hosted-release-refs-v1',source:'https://github.com/stablyai/orca.git',verified,baselineRef:'v1.4.245',tags,literals,objects:git('count-objects','-v')},null,2)+'\n');
          if(!verified) throw Error('Official release refs do not match their reviewed identities');
          NODE
      - name: Install the source-declared toolchain without saving caches
        uses: ./.github/actions/install-node-dependencies
        with:
          node-version: '24.18.1'
          native-runtime: node
          cache-pnpm-store: 'false'
          cache-pnpm-verification: 'false'
          persist-native-cache: 'false'
          cache-electron-package: 'false'
      - name: Install the exact source-pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: config/.bun-version
          no-cache: true
      - name: Prepare isolated display and Electron test runtime
        shell: bash
        run: |
          set -euo pipefail
          command -v xvfb-run >/dev/null || { sudo apt-get update; sudo apt-get install -y xvfb; }
          node config/scripts/install-electron-package-binary.mjs
          node --version > "$RUNNER_TEMP/orca245-evidence/toolchain.txt"
          pnpm --version >> "$RUNNER_TEMP/orca245-evidence/toolchain.txt"
          bun --version >> "$RUNNER_TEMP/orca245-evidence/toolchain.txt"
          node -p "require('./node_modules/vitest/package.json').version" >> "$RUNNER_TEMP/orca245-evidence/toolchain.txt"
          df -B1 . >> "$RUNNER_TEMP/orca245-evidence/toolchain.txt"
      - name: Record the selection the final source itself plans
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {existsSync,readdirSync,writeFileSync} from 'node:fs';
          import {collectChangedFiles,computePassHash} from './config/scripts/check-changed-pass-cache.mjs';
          import {planChangedChecks} from './config/scripts/check-changed-selection.mjs';
          import path from 'node:path';
          const root=process.cwd(),base='1c6ac8c3c4d2c3dec2cb5966d225ca2a0e0471d3';
          const files=collectChangedFiles(root,base);
          const plan=planChangedChecks(files,{scriptsDir:path.join(root,'config/scripts'),listDirectory:d=>{try{return readdirSync(path.join(root,d))}catch{return []}}});
          const exists=f=>existsSync(path.join(root,f));
          // No fixed counts: the collector holds the run to exactly this plan and the frozen changed paths.
          writeFileSync(`${process.env.RUNNER_TEMP}/orca245-evidence/selection.json`,JSON.stringify({base,files,existing:files.filter(exists),plan,unit:{related:plan.unitTests.related.filter(exists),colocated:plan.unitTests.colocated.filter(exists)},sourceInputHash:computePassHash(root,base)},null,2)+'\n');
          NODE
      - name: Prepare the pinned bounded log capture
        shell: bash
        run: |
          set -euo pipefail
          capture="$RUNNER_TEMP/orca245-capture.py"
          test ! -e "$capture"
          python3 - "$capture" <<'CAPTURE'
          import base64, hashlib, sys, zlib
          payload = zlib.decompress(base64.b64decode(''))
          if hashlib.sha256(payload).hexdigest() != '7795e35295d36dcf27896110698ac0c63065b80a1c5d095af38effcc1225ef4a':
              raise RuntimeError('capture content checksum mismatch')
          with open(sys.argv[1], 'xb') as stream:
              stream.write(payload)
          CAPTURE
      - name: Run every source-defined changed check once
        shell: bash
        env:
          ORCA_UNIT_FAILURE_REPORT_DIR: ${{ runner.temp }}/orca245-evidence/unit-failures
          ORCA_CROSS_VERSION_BASELINE_REF: v1.4.245
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/orca245-evidence"
          test ! -e "$ORCA_UNIT_FAILURE_REPORT_DIR"
          test "$(git rev-parse HEAD)" = 6809540d072d7a45abecb4b9efb24a6a2fdf28c2
          test -z "$(git status --porcelain)"
          test ! -e .cache/check-changed.json
          capture="$RUNNER_TEMP/orca245-capture.py"
          test -f "$capture"
          printf '%s  %s\n' '7795e35295d36dcf27896110698ac0c63065b80a1c5d095af38effcc1225ef4a' "$capture" | sha256sum --check --status
          started_at="$(date -u +%FT%TZ)"
          set +e
          # Streamed through a bounded capture: the log never holds more than 4 MiB, and verdicts come from the full stream.
          xvfb-run -a pnpm check:changed --force --base=1c6ac8c3c4d2c3dec2cb5966d225ca2a0e0471d3 --maxWorkers=2 --timeout=90 2>&1 | python3 "$capture" "$evidence/check-changed.log" "$evidence/check-changed.verdicts.log" "$evidence/capture.json"
          pipe=("${PIPESTATUS[@]}")
          gate_exit=${pipe[0]}
          capture_exit=${pipe[1]}
          if [ -f "$GITHUB_STEP_SUMMARY" ]; then head -c 262144 "$GITHUB_STEP_SUMMARY" > "$evidence/vitest-step-summary.md"; fi
          GATE_EXIT="$gate_exit" CAPTURE_EXIT="$capture_exit" GATE_STARTED="$started_at" node --input-type=module <<'NODE'
          import {writeFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const source=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          const dirty=execFileSync('git',['status','--porcelain'],{encoding:'utf8'}).trim();
          const code=Number(process.env.GATE_EXIT);
          writeFileSync(`${process.env.RUNNER_TEMP}/orca245-evidence/result.json`,JSON.stringify({schema:'orca245-hosted-gate-result-v2',source,sourceMatches:source==='6809540d072d7a45abecb4b9efb24a6a2fdf28c2',dirty,startedAt:process.env.GATE_STARTED,finishedAt:new Date().toISOString(),gateExit:code,captureExit:Number(process.env.CAPTURE_EXIT),command:'xvfb-run -a pnpm check:changed --force --base=1c6ac8c3c4d2c3dec2cb5966d225ca2a0e0471d3 --maxWorkers=2 --timeout=90',env:{ORCA_UNIT_FAILURE_REPORT_DIR:'evidence/unit-failures',ORCA_CROSS_VERSION_BASELINE_REF:process.env.ORCA_CROSS_VERSION_BASELINE_REF},nativeLifecycleQualification:false,dedicatedLanesQualification:false},null,2)+'\n');
          if(source!=='6809540d072d7a45abecb4b9efb24a6a2fdf28c2'||dirty!=='') process.exitCode=1;
          NODE
          result_exit=$?
          node --input-type=module - "$evidence" "$gate_exit" 6809540d072d7a45abecb4b9efb24a6a2fdf28c2 <<'NODE'
          import { createHash } from 'node:crypto'
          import { inflateSync } from 'node:zlib'
          const payload = inflateSync(Buffer.from('', 'base64'))
          if (createHash('sha256').update(payload).digest('hex') !== 'c21571218edefd99a38672171db1eadc4a494307ec369e892286027597d766c2') {
            throw new Error('collector content checksum mismatch')
          }
          await import('data:text/javascript;base64,' + payload.toString('base64'))
          NODE
          collector_exit=$?
          test "$gate_exit" -eq 0 && test "$capture_exit" -eq 0 && test "$result_exit" -eq 0 && test "$collector_exit" -eq 0
      - name: Enforce the evidence storage limit
        id: evidence_budget
        if: ${{ always() }}
        shell: bash
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import os
          root = Path(os.environ['RUNNER_TEMP']) / 'orca245-evidence'
          allowed = {'source.json', 'toolchain.txt', 'refs.json', 'selection.json', 'check-changed.log', 'check-changed.verdicts.log', 'capture.json', 'vitest-step-summary.md', 'result.json', 'collector.json'}
          assert root.is_dir() and not root.is_symlink()
          total = 0
          for entry in root.iterdir():
              assert not entry.is_symlink(), entry.name
              if entry.name == 'unit-failures':
                  assert entry.is_dir()
                  # Kept for inspection; the collector refuses start records, staged files and any other name.
                  assert all(f.is_file() and not f.is_symlink() and f.name.startswith('unit-failures-') for f in entry.iterdir())
                  unit = sum(f.lstat().st_size for f in entry.iterdir())
                  assert unit <= 8 * 1024 * 1024, 'Unit failure reports exceed their budget'
                  total += unit
              else:
                  assert entry.name in allowed and entry.is_file(), entry.name
                  total += entry.lstat().st_size
          assert total <= 16 * 1024 * 1024, 'Evidence exceeds reserved storage limit'
          print(f'Bounded evidence: {total} bytes')
          PYTHON
      - name: Retain bounded qualification evidence for one day
        if: ${{ always() && steps.evidence_budget.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: orca245-6809540-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/orca245-evidence/
          if-no-files-found: error
          retention-days: 1
          compression-level: 9
