      timeout-minutes: 1
      shell: bash
      run: |
        set -euo pipefail
        python3 "$AUDIT166_TOOLS/appimage-control.py" observe-final
      if: ${{ always() }}
    - name: Require bounded AppImage, exact source metadata and settled owned processes
      timeout-minutes: 1
      shell: bash
      run: |
        set -euo pipefail
        python3 "$AUDIT166_TOOLS/appimage-control.py" artifact
      id: appimage_gate
    - name: Upload qualified f86 candidate only
      if: ${{ success() && steps.appimage_gate.outcome == 'success' }}
      timeout-minutes: 2
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: wake-f86-appimage-${{ github.run_id }}-a1
        path: dist/orca-linux.AppImage
