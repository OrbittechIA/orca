name: Audit166 pinned AppImageebe
run-name: Audit166 AppImageebe only
on:
  workflow_dispatch:
    inputs:
      qualification_acceptance_sha256:
        description: Exact Root receipt digest for the fully accepted bound source qualification
        required: true
        type: string
permissions:
  contents: read
  actions: read
cache-mode: read
concurrency:
  group: audit166-appimage53-${{ github.ref }}
  cancel-in-progress: false
jobs:
  appimage53:
    if: github.repository == 'OrbittechIA/orca' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/audit166/appimageebe-20261101-r6' && github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ORCA_BACKGROUND_LAUNCH: '1'
      CI: 'true'
      ORCA_PNPM_GLOBAL_VIRTUAL_STORE: '0'
      ORCA_CI_MAIN_SOURCEMAPS: '0'
      ORCA_BUILD_COMMIT: 'ebe645eb6e49bf7979d25114c738c9d174ad5726'
      NODE_OPTIONS: --max-old-space-size=4096
      AUDIT166_LANE: appimage53
    steps:
      - name: Prepare private job paths
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PATHS'
          import os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          assert root.is_absolute() and '\n' not in str(root) and '\r' not in str(root)
          paths={'AUDIT166_TOOLS':root/'appimage53-control','AUDIT166_EVIDENCE':root/'orca245-evidence'}
          for path in paths.values():path.mkdir(exist_ok=False)
          with open(os.environ['GITHUB_ENV'],'a') as f:
              for name,path in paths.items():f.write(f'{name}={path}\n')
          PATHS
      - name: Prepare pinned clock.py
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PAYLOAD'
          import os,base64,zlib,hashlib
          from pathlib import Path
          data=zlib.decompress(base64.b64decode('',validate=True))
          assert hashlib.sha256(data).hexdigest()=='99b5996eff7ec088d9eb4050b9a46bc98f6f36ceb975b3288308b817c89b8cd6'
          with (Path(os.environ['AUDIT166_TOOLS'])/'clock.py').open('xb') as f:f.write(data)
          PAYLOAD
      - name: Prepare pinned supervisor.py
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PAYLOAD'
          import os,base64,zlib,hashlib
          from pathlib import Path
          data=zlib.decompress(base64.b64decode('',validate=True))
          assert hashlib.sha256(data).hexdigest()=='770f9d6ff19795ea8278a7713af2d73ac2d68195073ad8d107bb0e0d6afa80eb'
          with (Path(os.environ['AUDIT166_TOOLS'])/'supervisor.py').open('xb') as f:f.write(data)
          PAYLOAD
      - name: Prepare pinned capture.py
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PAYLOAD'
          import os,base64,zlib,hashlib
          from pathlib import Path
          data=zlib.decompress(base64.b64decode('',validate=True))
          assert hashlib.sha256(data).hexdigest()=='7795e35295d36dcf27896110698ac0c63065b80a1c5d095af38effcc1225ef4a'
          with (Path(os.environ['AUDIT166_TOOLS'])/'capture.py').open('xb') as f:f.write(data)
          PAYLOAD
      - name: Prepare pinned suppress-own-post-cache.py
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PAYLOAD'
          import os,base64,zlib,hashlib
          from pathlib import Path
          data=zlib.decompress(base64.b64decode('',validate=True))
          assert hashlib.sha256(data).hexdigest()=='c034230a41ded19df5426da69245102730adecc4d1f1d2ba04a324628c7756b6'
          with (Path(os.environ['AUDIT166_TOOLS'])/'suppress-own-post-cache.py').open('xb') as f:f.write(data)
          PAYLOAD
      - name: Prepare pinned appimage-control.py
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PAYLOAD'
          import os,base64,zlib,hashlib
          from pathlib import Path
          data=zlib.decompress(base64.b64decode('',validate=True))
          assert hashlib.sha256(data).hexdigest()=='51a49ff88fa64d2748666c6392f9459056851eab5b80e14fa7b8e25b31ffcdb5'
          with (Path(os.environ['AUDIT166_TOOLS'])/'appimage-control.py').open('xb') as f:f.write(data)
          PAYLOAD
      - name: Prepare pinned SOURCE-PINS.json
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PAYLOAD'
          import os,base64,zlib,hashlib
          from pathlib import Path
          data=zlib.decompress(base64.b64decode('',validate=True))
          assert hashlib.sha256(data).hexdigest()=='65552db6e2933e5406429210bc1d2b3a5d39e537e02c865da17180f0af494815'
          with (Path(os.environ['AUDIT166_TOOLS'])/'SOURCE-PINS.json').open('xb') as f:f.write(data)
          PAYLOAD
      - name: Prepare pinned CONTRACT.json
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PAYLOAD'
          import os,base64,zlib,hashlib
          from pathlib import Path
          data=zlib.decompress(base64.b64decode('',validate=True))
          assert hashlib.sha256(data).hexdigest()=='a11a219c27de4ae6f938790bf73fe884bedb420a474ed4fa39b35eba44746c95'
          with (Path(os.environ['AUDIT166_TOOLS'])/'CONTRACT.json').open('xb') as f:f.write(data)
          PAYLOAD
      - name: Anchor45minute native worker clock
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          python3 "$AUDIT166_TOOLS/clock.py"
      - name: Require entire Root bound successful source qualification
        env:
          GH_TOKEN: ${{ github.token }}
          ROOT_QUALIFICATION_ACCEPTANCE_SHA256: ${{ inputs.qualification_acceptance_sha256 }}
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          python3 "$AUDIT166_TOOLS/appimage-control.py" qualification
      - name: Checkout exactebe product
        timeout-minutes: 2
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: "ebe645eb6e49bf7979d25114c738c9d174ad5726"
          persist-credentials: "false"
          fetch-depth: "1"
      - name: Verify source and empty dedicated Docker baseline
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          python3 "$AUDIT166_TOOLS/appimage-control.py" preflight
      - name: Admit dependency phase
        timeout-minutes: 1
        shell: bash
        run: |
          python3 "$AUDIT166_TOOLS/appimage-control.py" admit 600
      - name: Install source dependencies with enforced cache read
        timeout-minutes: 8
        uses: ./.github/actions/install-node-dependencies
        with:
          node-version: "24.18.1"
          native-runtime: "node"
          cache-pnpm-store: "false"
          cache-pnpm-verification: "false"
          persist-native-cache: "false"
          cache-electron-package: "false"
      - name: Setup pinned Bun144
        timeout-minutes: 1
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: "config/.bun-version"
          no-cache: "true"
      - name: Admit mobile dependency phase
        timeout-minutes: 1
        shell: bash
        run: |
          python3 "$AUDIT166_TOOLS/appimage-control.py" admit 180
      - name: Install frozen mobile dependencies
        timeout-minutes: 3
        uses: ./.github/actions/install-mobile-dependencies
      - name: Verify exact toolchain
        timeout-minutes: 1
        shell: bash
        run: |
          python3 "$AUDIT166_TOOLS/appimage-control.py" toolchain
      - name: Build native and desktop assets with reviewed ownership supervisor
        timeout-minutes: 22
        shell: bash
        run: |
          set -euo pipefail
          python3 "$AUDIT166_TOOLS/appimage-control.py" phase assets
      - name: Build AppImage only with all upstream package hooks
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          python3 "$AUDIT166_TOOLS/appimage-control.py" phase package
      - name: Always observe final disk and containers without cleanup
        if: ${{ always() }}
        timeout-minutes: 1
        shell: bash
        run: |
          python3 "$AUDIT166_TOOLS/appimage-control.py" observe-final
      - name: Require complete build settlement and bounded AppImage
        id: appimage_gate
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          python3 "$AUDIT166_TOOLS/appimage-control.py" artifact
      - name: Upload positively qualified bounded AppImage
        if: ${{ success() && steps.appimage_gate.outcome == 'success' }}
        timeout-minutes: 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: "appimageebe-${{ github.run_id }}-a1"
          path: "dist/orca-linux.AppImage"
          retention-days: "1"
          compression-level: "0"
          if-no-files-found: "error"
      - name: Always gate diagnostic size separately
        id: diagnostic_gate
        if: ${{ always() }}
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          python3 "$AUDIT166_TOOLS/appimage-control.py" metadata-budget
      - name: Retain only bounded diagnostics
        if: ${{ always() && steps.diagnostic_gate.outcome == 'success' }}
        timeout-minutes: 1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: "appimageebe-diagnostics-${{ github.run_id }}-a1"
          path: "${{ runner.temp }}/orca245-evidence/"
          retention-days: "1"
          compression-level: "6"
          if-no-files-found: "error"
      - name: Finally suppress only own pnpm post memo
        if: ${{ always() }}
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          python3 "$AUDIT166_TOOLS/suppress-own-post-cache.py"
