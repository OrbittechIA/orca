          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'audit166-control'
          part = root / 'capture.py.payload'
          with part.open('x') as stream:
              stream.write('')
          data = zlib.decompress(base64.b64decode(part.read_text(), validate=True))
          assert hashlib.sha256(data).hexdigest() == '7795e35295d36dcf27896110698ac0c63065b80a1c5d095af38effcc1225ef4a'
          with (root / 'capture.py').open('xb') as stream:
