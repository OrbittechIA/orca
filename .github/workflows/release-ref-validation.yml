      - name: Bind frozen planner bytes for every consumer
        id: plan_pin
        timeout-minutes: 1
        shell: bash
        run: |
          python3 - <<'PLANPIN'
          import os,hashlib
          from pathlib import Path
          value=hashlib.sha256((Path(os.environ['AUDIT166_EVIDENCE'])/'ci-shards/expected.json').read_bytes()).hexdigest()
