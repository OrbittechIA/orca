      - name: Prepare frozen control bundle part7
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'ADMISSION'
          import os,time
          final=float(os.environ["AUDIT166_FINALIZATION_DEADLINE"])
          hard=float(os.environ["AUDIT166_HARD_JOB_DEADLINE"])
          assert hard-final>=300
          assert time.time()+60+60<=final, "phase budget exhausted"
          ADMISSION
          python3 - <<'PAYLOAD'
          import os,base64,zlib,hashlib,json
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'audit166-control'
          part=root/'CONTROLS.payload'
          with part.open('a') as f:f.write('')
          data=zlib.decompress(base64.b64decode(part.read_text(),validate=True))
          assert hashlib.sha256(data).hexdigest()=='15ff8fda65ef7386a0857267a9cd8d4c0301648eadfd49afa0216c74fd17f59c'
          records=json.loads(data);names=[record['name'] for record in records]
          assert len(names)==len(set(names)) and all(Path(name).name==name and name not in ['.','..'] for name in names)
          for record in records:
              data=record['utf8'].encode()
              assert hashlib.sha256(data).hexdigest()==record['sha256']
              with (root/record['name']).open('xb') as f:f.write(data)
          part.unlink()
          PAYLOAD
      - name: Checkout frozen product source
        timeout-minutes: 2
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: "4eac6a5e901b6260fa60796e201a93ca8f5262a0"
          fetch-depth: "192"
          persist-credentials: "false"
      - name: Fetch exact requested base before merge-base proof
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'ADMISSION'
          import os,time
          final=float(os.environ["AUDIT166_FINALIZATION_DEADLINE"])
          hard=float(os.environ["AUDIT166_HARD_JOB_DEADLINE"])
          assert hard-final>=300
          assert time.time()+120+60<=final, "phase budget exhausted"
          ADMISSION
          timeout --signal=TERM --kill-after=10s 100s git -c gc.auto=0 -c maintenance.auto=false fetch --no-tags --depth=192 https://github.com/OrbittechIA/orca.git d075430cb1a50ef7674e7fe7c560d397ac7fe38a
          test "$(git rev-parse --verify FETCH_HEAD^{commit})" = d075430cb1a50ef7674e7fe7c560d397ac7fe38a
          test "$(git rev-parse HEAD)" = 4eac6a5e901b6260fa60796e201a93ca8f5262a0
      - name: Verify exact frozen4eac source pins and helper bindings
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'ADMISSION'
          import os,time
          final=float(os.environ["AUDIT166_FINALIZATION_DEADLINE"])
          hard=float(os.environ["AUDIT166_HARD_JOB_DEADLINE"])
          assert hard-final>=300
          assert time.time()+60+60<=final, "phase budget exhausted"
          ADMISSION
          python3 "$AUDIT166_TOOLS/lane-runtime.py" preflight "$AUDIT166_EVIDENCE"
      - name: Fetch and verify frozen official refs
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'ADMISSION'
          import os,time
          final=float(os.environ["AUDIT166_FINALIZATION_DEADLINE"])
          hard=float(os.environ["AUDIT166_HARD_JOB_DEADLINE"])
          assert hard-final>=300
          assert time.time()+180+60<=final, "phase budget exhausted"
          ADMISSION
          git fetch --no-tags --depth=1 https://github.com/stablyai/orca.git refs/tags/v1.4.184:refs/tags/v1.4.184 refs/tags/v1.4.190:refs/tags/v1.4.190 refs/tags/v1.4.199:refs/tags/v1.4.199 refs/tags/v1.4.205:refs/tags/v1.4.205 refs/tags/v1.4.211:refs/tags/v1.4.211 refs/tags/v1.4.212:refs/tags/v1.4.212 refs/tags/v1.4.214:refs/tags/v1.4.214 refs/tags/v1.4.218:refs/tags/v1.4.218 refs/tags/v1.4.219:refs/tags/v1.4.219 refs/tags/v1.4.220:refs/tags/v1.4.220 refs/tags/v1.4.221:refs/tags/v1.4.221 refs/tags/v1.4.222:refs/tags/v1.4.222 refs/tags/v1.4.224:refs/tags/v1.4.224 refs/tags/v1.4.228:refs/tags/v1.4.228 refs/tags/v1.4.229:refs/tags/v1.4.229 refs/tags/v1.4.244:refs/tags/v1.4.244 refs/tags/v1.4.245:refs/tags/v1.4.245
          git fetch --no-tags --depth=1 https://github.com/stablyai/orca.git 3727100cc9dbcea6201f8a3e506676a3c4b53b18 4bb337741c335cfcc428d3b4271023566e2dadb8 4cb013c0a9251275fa3d20ea33b45429e07aa6be 5a56636f6679071d6ec68b851ef7932cd3222560 aac38d698ff75ac4c8658addab48ef5a83617619 b49abdb1f4da6b3d62dfa9ccf3c74dc9e74d291c b6b4d68cd844c921c7c5191cef72d5adafc0dafa e817b0e23747ffd6f16f2ddefea861950d82a3c0 f97ca2a49d9c711dab54a656a7f8a47ae6c6749c fd9125ea8c7b347cd8b675a4095e31cd3c865d25
          python3 "$AUDIT166_TOOLS/lane-runtime.py" refs "$AUDIT166_EVIDENCE"
      - name: Admit bounded script-free dependency setup
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'ADMISSION'
          import os,time
          final=float(os.environ["AUDIT166_FINALIZATION_DEADLINE"])
          hard=float(os.environ["AUDIT166_HARD_JOB_DEADLINE"])
